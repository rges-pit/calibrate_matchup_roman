[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrate-matchup-roman"
dynamic = ["version"]
description = "Calibrate Jay Anderson MATCHUP star lists (Roman WFI): RA/Dec via Gaia, AB zero point via MAST Roman catalogs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jessica Lu"},
]
keywords = ["astronomy", "Roman", "astrometry", "photometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "astropy",
    "astroquery",
    "requests",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/rges-pit/calibrate_matchup_roman"
Repository = "https://github.com/rges-pit/calibrate_matchup_roman"
Issues = "https://github.com/rges-pit/calibrate_matchup_roman/issues"

[project.scripts]
calibrate-matchup-roman = "calibrate_matchup_roman.cli:main"

[tool.setuptools]
packages = ["calibrate_matchup_roman"]

[tool.setuptools.dynamic]
version = {attr = "calibrate_matchup_roman.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
